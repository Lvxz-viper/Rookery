<meta name="description" content="Play chess online with friends, solve puzzles and review your games.">

<style>
/* Rookery: a tournament hall at night. Felt-green ground, bone text, brass from the clock hardware.
   Layout: sidebar | board column | side panel. Pages (home, community, profile) use a 12-col reading grid. */
:root{
  --felt:#131a16; --felt2:#18211c; --baize:#1d2722; --baize2:#243029; --baize3:#2c3a32;
  --line:#2c3831; --line2:#3a4840;
  --bone:#ece6d6; --bone2:#d9d2bf; --muted:#9ba79c; --dim:#6c786f;
  --brass:#c9a45c; --brass2:#e0c389; --brass-ink:#22190a;
  --win:#80b98c; --loss:#d47a66; --draw:#a3ab9f; --warn:#d9b45b; --info:#7aa3c9;
  --light:#e7d6b8; --dark:#a57d58; --hl:rgba(212,170,80,.42); --sel:rgba(212,170,80,.62); --pre:rgba(86,128,196,.55);
  --serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --sans:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r1:4px; --r2:7px; --r3:12px;
  --bs:min(560px,calc(100vw - 24px)); --side:224px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--felt);color:var(--bone);font:400 14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden;font-feature-settings:"ss01"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--felt);z-index:80}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
input,textarea,select{font:inherit;color:var(--bone);background:var(--felt2);border:1px solid var(--line2);border-radius:var(--r2);padding:10px 12px;width:100%;transition:border-color .15s}
input:focus,textarea:focus{outline:none;border-color:var(--brass)}
textarea{resize:vertical;min-height:84px;font-size:13px;line-height:1.5}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
::selection{background:rgba(201,164,92,.35)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
.serif{font-family:var(--serif)}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100%}
.side{background:var(--felt2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px 14px;gap:2px;min-height:0;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 20px;text-decoration:none;color:var(--bone)}
.brand svg{width:30px;height:30px;flex:none;color:var(--brass)}
.brand b{font:600 25px/1 var(--serif);letter-spacing:.005em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:13px;padding:10px 12px;border-radius:var(--r2);color:var(--muted);text-decoration:none;font-weight:500;font-size:14.5px;position:relative;transition:color .15s,background .15s}
.nav a svg{width:21px;height:21px;flex:none}
.nav a:hover{color:var(--bone);background:var(--baize)}
.nav a.on{color:var(--bone);background:var(--baize)}
.nav a.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--brass)}
.nav a .dot{margin-left:auto;min-width:18px;height:18px;border-radius:9px;background:var(--brass);color:var(--brass-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.side .fill{flex:1}
.me-chip{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r2);text-decoration:none;color:var(--bone);transition:background .15s}
.me-chip:hover{background:var(--baize)}
.me-chip div{min-width:0;line-height:1.25}
.me-chip b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-chip small{color:var(--muted);font-size:12.5px}
.netdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--win);margin-right:6px;vertical-align:1px}
.netdot.off{background:var(--loss)}
.main{position:relative;min-width:0;height:100%;overflow:hidden}
.tabbar{display:none}

/* ---------- board layout ---------- */
.stage{display:flex;gap:24px;justify-content:center;align-items:flex-start;height:100%;padding-block:20px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0}
.bcol{flex:none;display:flex;flex-direction:column;gap:8px}
.bwrap{display:flex;gap:8px}
.bbox{position:relative}
.evalbar{width:20px;flex:none;border-radius:var(--r1);overflow:hidden;background:#33302a;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.evalbar .w{position:absolute;left:0;right:0;bottom:0;height:50%;background:#efe9da;transition:height .7s cubic-bezier(.2,.8,.2,1)}
.evalbar.flip .w{top:0;bottom:auto}
.evalbar span{position:absolute;left:0;right:0;text-align:center;font:700 9.5px var(--sans);letter-spacing:-.02em}
.evalbar .t{top:6px;color:#efe9da}.evalbar .b{bottom:6px;color:#2b2822}

.board{position:relative;width:var(--bs);height:var(--bs);border-radius:3px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 1px 0 rgba(255,255,255,.04),0 24px 48px -20px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.35)}
.sqs{position:absolute;inset:0;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr)}
.sq{position:relative;background:var(--light)}
.sq.d{background:var(--dark)}
.sq.last::before,.sq.sel::before,.sq.mk::before,.sq.pre::before{content:"";position:absolute;inset:0}
.sq.last::before{background:var(--hl)}
.sq.sel::before{background:var(--sel)}
.sq.pre::before{background:var(--pre)}
.sq.mk::before{background:rgba(196,72,58,.72)}
.sq.chk::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(220,52,36,.95) 0,rgba(220,52,36,.55) 36%,rgba(220,52,36,0) 72%)}
.sq.dot::after{content:"";position:absolute;left:37%;top:37%;width:26%;height:26%;border-radius:50%;background:rgba(20,26,22,.24)}
.sq.cap::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,transparent 0 64%,rgba(20,26,22,.26) 65% 100%)}
.sq.hov{box-shadow:inset 0 0 0 calc(var(--bs)/110) rgba(255,255,255,.6)}
.coord{position:absolute;font:600 calc(var(--bs)/50) var(--sans);pointer-events:none;line-height:1}
.coord.r{left:4%;top:4%}.coord.f{right:5%;bottom:4%}
.sq .coord{color:var(--dark)}.sq.d .coord{color:var(--light)}
.pcs{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;background-size:100% 100%;filter:drop-shadow(0 calc(var(--bs)/240) calc(var(--bs)/320) rgba(20,14,8,.32));will-change:transform;transition:transform var(--mv,.17s) cubic-bezier(.2,.8,.2,1)}
.pc.drag{transition:none;z-index:5;filter:drop-shadow(0 12px 10px rgba(0,0,0,.4));transform-origin:center}
.pc.ghost{transition:opacity .2s ease-out;opacity:0}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.badges{position:absolute;inset:0;pointer-events:none}
.badge{position:absolute;width:12.5%;height:12.5%}
.badge i{position:absolute;right:-3%;top:-5%;width:40%;height:40%;border-radius:50%;display:grid;place-items:center;font:700 calc(var(--bs)/52) var(--sans);font-style:normal;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.45),0 0 0 2px #fff;animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.promo{position:absolute;inset:0;background:rgba(10,14,12,.45);z-index:20}
.promo .col{position:absolute;width:12.5%;display:flex;flex-direction:column;background:var(--bone);border-radius:4px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.55)}
.promo .col button{aspect-ratio:1;background-size:88%;background-position:center;background-repeat:no-repeat;transition:background-color .12s}
.promo .col button:hover{background-color:var(--brass2)}

.pbar{display:flex;align-items:center;gap:11px;height:48px;min-width:0}
.pbar .who{min-width:0;flex:1}
.pname{display:flex;align-items:baseline;gap:7px;font-weight:600;font-size:14.5px;white-space:nowrap;min-width:0}
.pname .n{overflow:hidden;text-overflow:ellipsis}
.pname .r{color:var(--muted);font-weight:500;font-size:13px}
.ttl{display:inline-block;font:700 10.5px/1 var(--sans);letter-spacing:.04em;color:var(--brass-ink);background:var(--brass);padding:3px 5px 2px;border-radius:3px;margin-right:6px;vertical-align:2px}
.pname .off{color:var(--loss);font-weight:500;font-size:12px}
.caps{display:flex;align-items:center;height:18px;margin-top:1px}
.caps i{width:18px;height:18px;background-size:100%;margin-right:-8px;flex:none}
.caps i.gap{margin-right:1px}
.caps b{font-weight:600;font-size:12px;color:var(--muted);margin-left:12px}
.clock{flex:none;display:flex;align-items:center;gap:8px;font:600 21px var(--sans);font-variant-numeric:tabular-nums;letter-spacing:.01em;padding:7px 14px;border-radius:var(--r2);background:var(--baize);color:var(--dim);min-width:112px;justify-content:flex-end;transition:background .2s,color .2s,box-shadow .2s}
.clock.on{background:var(--bone);color:#1b1f1c;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 6px 18px -8px rgba(236,230,214,.45)}
.clock.on.low{background:var(--loss);color:#fff;animation:lowpulse 1s ease-in-out infinite}
@keyframes lowpulse{50%{box-shadow:0 0 0 4px rgba(212,122,102,.25)}}
.clock svg{width:15px;height:15px;opacity:.7}
.thinking{display:inline-flex;gap:3px;margin-left:4px;align-self:center}
.thinking i{width:4px;height:4px;border-radius:50%;background:var(--brass);animation:bob 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,80%,100%{opacity:.35;transform:none}40%{opacity:1;transform:translateY(-3px)}}

/* ---------- avatars ---------- */
.av{--s:40px;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.2);background:var(--t,#5d7a64);display:grid;place-items:center;flex:none;position:relative;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.12)}
.av>i{width:80%;height:80%;background-size:100% 100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.av.xs{--s:24px}.av.sm{--s:32px}.av.lg{--s:64px}.av.xl{--s:88px}
.av .st{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:var(--win);box-shadow:0 0 0 2px var(--felt2)}
.av .st.off{background:var(--dim)}.av .st.play{background:var(--brass)}

/* ---------- panel ---------- */
.panel{width:388px;flex:none;background:var(--felt2);border:1px solid var(--line);border-radius:var(--r3);display:flex;flex-direction:column;overflow:hidden;height:var(--ph,640px)}
.ph{padding:18px 20px 14px;display:flex;align-items:center;gap:12px;flex:none}
.ph h2{font:600 26px/1.1 var(--serif);flex:1;min-width:0;letter-spacing:-.005em}
.ph .meta{font-size:13px;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line);flex:none}
.tabs button{padding:10px 10px 11px;color:var(--muted);font-weight:500;font-size:14px;position:relative}
.tabs button.on{color:var(--bone)}
.tabs button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--brass);border-radius:2px}
.tabs button .cnt{margin-left:5px;background:var(--brass);color:var(--brass-ink);border-radius:8px;font-size:11px;font-weight:700;padding:0 5px}
.pbody{flex:1;overflow:auto;padding:16px 20px 18px;display:flex;flex-direction:column;gap:16px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.pbody>*{flex-shrink:0}
.pfoot{padding:14px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex:none}
.h{font-weight:600;font-size:13.5px;color:var(--muted);margin-bottom:-6px}
.note{color:var(--muted);font-size:13.5px;margin:0}
.fine{color:var(--dim);font-size:12.5px;margin:0}

/* ---------- buttons ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;border-radius:var(--r2);background:var(--baize2);border:1px solid var(--line2);font-weight:500;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,transform .08s}
.btn:hover{background:var(--baize3)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--bone);color:#18201b;border-color:transparent;font-weight:600}
.btn.pri:hover{background:#fff8e8}
.btn.brass{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:600}
.btn.brass:hover{background:var(--brass2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--bone);background:var(--baize)}
.btn.danger{background:rgba(212,122,102,.14);border-color:rgba(212,122,102,.35);color:#f0a998}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.lg{padding:14px 20px;font-size:16px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg{width:17px;height:17px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.seg{display:flex;background:var(--felt);border:1px solid var(--line);border-radius:var(--r2);padding:3px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:5px;font-weight:500;font-size:13.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,color .15s}
.seg button.on{background:var(--baize2);color:var(--bone);box-shadow:0 1px 0 rgba(255,255,255,.05)}
.seg button i{width:18px;height:18px;background-size:100%;flex:none}

/* time-control tiles: the numerals are the design */
.tcs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tc{display:grid;justify-items:center;gap:0;padding:12px 6px 10px;border-radius:var(--r2);background:var(--baize);border:1px solid var(--line);transition:border-color .15s,background .15s,transform .12s}
.tc b{font:500 21px/1.05 var(--serif);word-spacing:-.1em;letter-spacing:-.01em;font-variant-numeric:lining-nums}
.tc b em{font-style:normal;color:var(--brass);font-size:.6em;margin:0 .12em;position:relative;top:-.22em}
.tc small{font-size:12px;color:var(--muted);margin-top:3px}
.tc:hover{border-color:var(--line2);background:var(--baize2)}
.tc.on{border-color:var(--brass);background:rgba(201,164,92,.09)}
.tc.on small{color:var(--brass2)}

.bots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.bots button{display:grid;justify-items:center;gap:5px;padding:7px 0 6px;border-radius:var(--r2);border:1px solid transparent;transition:border-color .15s,background .15s}
.bots button small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bots button:hover{background:var(--baize)}
.bots button.on{border-color:var(--brass);background:rgba(201,164,92,.08)}
.bots .av{--s:36px}
.hero{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:var(--r3);background:linear-gradient(180deg,var(--baize),var(--felt2));border:1px solid var(--line)}
.hero h3{font:600 23px/1.1 var(--serif)}
.hero .sub{font-size:13px;color:var(--brass2);margin-top:3px}
.hero p{margin:7px 0 0;color:var(--muted);font-size:13.5px}

.bubble{display:flex;gap:10px;align-items:flex-start}
.bubble p{margin:0;background:var(--baize);border:1px solid var(--line);padding:9px 12px;border-radius:3px 12px 12px 12px;font-size:13.5px;animation:rise .3s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- move list (a scoresheet) ---------- */
.opening{display:flex;gap:10px;align-items:baseline;font-size:13.5px;min-height:20px}
.opening b{font-weight:500}
.opening .eco{color:var(--brass2);font-weight:600;font-size:12.5px}
.mvl{display:flex;flex-direction:column;font-size:14px;border-top:1px solid var(--line)}
.mvr{display:grid;grid-template-columns:44px 1fr 1fr;align-items:center;border-bottom:1px solid var(--line);min-height:34px}
.mvn{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums;padding-left:4px}
.mv{padding:6px 8px;border-radius:4px;text-align:left;display:flex;align-items:center;gap:7px;font-weight:500;min-width:0;margin:2px 4px 2px 0}
.mv:hover{background:var(--baize2)}
.mv.cur{background:var(--baize3);box-shadow:inset 0 -2px 0 var(--brass)}
.mv .g{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font:700 9px var(--sans);color:#fff;flex:none}
.mv .tm{margin-left:auto;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.empty{color:var(--dim);font-size:13.5px;text-align:center;padding:22px 10px}

.ctrl{display:flex;gap:2px;padding:8px 10px;border-top:1px solid var(--line);flex:none;background:var(--felt2)}
.ib{flex:1;height:40px;border-radius:var(--r2);display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.ib:hover{background:var(--baize);color:var(--bone)}
.ib svg{width:20px;height:20px}
.ib[disabled]{opacity:.28;pointer-events:none}
.ib.armed{background:var(--loss);color:#fff}
.ib.armed.draw{background:var(--brass);color:var(--brass-ink)}
.ib.on{color:var(--brass2)}
.sep{width:1px;background:var(--line);margin:7px 4px}

.offer{display:flex;align-items:center;gap:8px;background:rgba(201,164,92,.1);border:1px solid rgba(201,164,92,.35);border-radius:var(--r2);padding:10px 12px;font-weight:500;font-size:14px;animation:rise .25s}
.offer span{flex:1}
.msg{border-radius:var(--r2);padding:11px 14px;font-weight:500;font-size:14px;display:flex;gap:9px;align-items:center;animation:rise .25s}
.msg svg{width:18px;height:18px;flex:none}
.msg.ok{background:rgba(128,185,140,.13);color:#a9d8b3}
.msg.no{background:rgba(212,122,102,.13);color:#f1ab9b}
.msg.info{background:var(--baize);color:var(--bone2)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}
.chatlist{display:flex;flex-direction:column;gap:6px;overflow:auto;font-size:14px;flex:1;min-height:120px;padding-right:2px}
.chatlist p{margin:0;padding:7px 11px;border-radius:12px 12px 12px 3px;background:var(--baize);max-width:85%;align-self:flex-start;word-break:break-word;animation:rise .2s}
.chatlist p.mine{align-self:flex-end;background:rgba(201,164,92,.16);border-radius:12px 12px 3px 12px}
.chatlist p b{font-weight:600;font-size:12px;color:var(--muted);display:block}
.chatin{display:flex;gap:6px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{font-size:12.5px;padding:5px 11px;border-radius:20px;border:1px solid var(--line2);color:var(--muted);transition:color .15s,border-color .15s}
.quick button:hover{color:var(--bone);border-color:var(--muted)}

/* engine */
.eng{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.eng .top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--baize)}
.eng .top b{font:600 22px var(--sans);font-variant-numeric:tabular-nums;min-width:66px}
.eng .top small{color:var(--muted);font-size:12.5px}
.eng .line{display:flex;gap:10px;padding:8px 12px;font-size:13.5px;align-items:baseline;border-top:1px solid var(--line);cursor:pointer}
.eng .line:hover{background:var(--baize)}
.eng .line .s{flex:none;min-width:48px;font-weight:600;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:4px;text-align:center;font-size:12.5px}
.eng .line .s.w{background:#ece6d6;color:#1b1f1c}.eng .line .s.b{background:#33302a;color:#ece6d6}
.eng .line .pv{color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.eng .line .pv b{color:var(--bone);font-weight:600}
.tog{width:40px;height:23px;border-radius:12px;background:var(--baize3);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:var(--muted);transition:transform .2s cubic-bezier(.2,.8,.2,1),background .2s}
.tog.on{background:var(--brass)}
.tog.on::after{transform:translateX(17px);background:var(--brass-ink)}

/* review */
.acc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acc>div{padding:12px 14px;border-radius:var(--r2);background:var(--baize);display:flex;gap:11px;align-items:center}
.acc b{font:600 30px/1 var(--serif);font-variant-numeric:lining-nums;display:block}
.acc small{color:var(--muted);font-size:12px}
.graph{width:100%;height:78px;border-radius:var(--r2);overflow:hidden;background:#2e2c27;cursor:pointer;display:block}
.ctab{display:grid;grid-template-columns:1fr 44px 44px;gap:3px 8px;font-size:13.5px;align-items:center}
.ctab .hd{font-size:12px;color:var(--dim);font-weight:600;text-align:center}
.ctab .c{display:flex;gap:9px;align-items:center}
.ctab .c i{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font:700 9.5px var(--sans);color:#fff;font-style:normal;flex:none}
.ctab .n{text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.ctab .z{color:var(--dim);font-weight:400}
.coach{padding:13px 14px;border-radius:var(--r2);background:var(--baize);display:flex;gap:12px;align-items:flex-start;min-height:70px}
.coach .g{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--sans);color:#fff;flex:none}
.coach b{display:block;font-size:15px;font-weight:600}
.coach p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.prog{height:4px;border-radius:2px;background:var(--baize3);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brass);transition:width .25s}

/* puzzles */
.pzhead{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r2);background:var(--baize)}
.pzhead .side{width:28px;height:28px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.pzhead h3{font:600 20px/1.15 var(--serif)}
.pzhead p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:20px;border:1px solid var(--line2);font-size:13px;color:var(--muted);transition:all .15s}
.chip:hover{color:var(--bone);border-color:var(--muted)}
.chip.on{background:var(--bone);color:#18201b;border-color:var(--bone)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:11px 12px;border-radius:var(--r2);background:var(--baize)}
.stat small{display:block;font-size:12px;color:var(--muted)}
.stat b{font:600 24px/1.15 var(--serif);font-variant-numeric:lining-nums tabular-nums;display:block}
.delta{font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.delta.up{color:var(--win)}.delta.dn{color:var(--loss)}

/* ---------- pages ---------- */
.page{height:100%;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.wrap{max-width:1180px;margin:0 auto;padding-block:36px 64px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.ptitle{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.ptitle h1{font:500 44px/1.02 var(--serif);letter-spacing:-.015em;flex:1;min-width:0}
.ptitle p{margin:8px 0 0;color:var(--muted);font-size:15px}
.cols{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:28px;align-items:start}
.blk{display:flex;flex-direction:column;gap:12px}
.blk>h2{font:600 19px/1.2 var(--sans);display:flex;align-items:center;gap:10px}
.blk>h2 .lnk{margin-left:auto;font:500 13.5px var(--sans);color:var(--muted);text-decoration:none}
.blk>h2 .lnk:hover{color:var(--bone)}
.card{background:var(--felt2);border:1px solid var(--line);border-radius:var(--r3);padding:18px}
.stack{display:flex;flex-direction:column;gap:28px}

.quickgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.qt{position:relative;display:grid;justify-items:start;align-content:space-between;gap:16px;padding:16px 16px 14px;min-height:118px;border-radius:var(--r3);background:var(--felt2);border:1px solid var(--line);text-align:left;overflow:hidden;transition:border-color .18s,background .18s,transform .18s cubic-bezier(.2,.8,.2,1)}
.qt b{font:500 38px/.95 var(--serif);letter-spacing:-.02em;font-variant-numeric:lining-nums}
.qt b em{font-style:normal;color:var(--brass);font-size:.55em;margin:0 .14em;position:relative;top:-.28em;font-weight:400}
.qt small{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;width:100%}
.qt small span{margin-left:auto;font-variant-numeric:tabular-nums}
.qt:hover{border-color:var(--brass);background:var(--baize);transform:translateY(-2px)}
.qt.busy{border-color:var(--brass);background:rgba(201,164,92,.08)}
.qt.busy::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:40%;background:var(--brass);animation:scan 1.1s ease-in-out infinite}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:var(--r3);background:var(--felt2);border:1px solid var(--line);text-align:left;transition:border-color .15s,background .15s}
.act:hover{border-color:var(--line2);background:var(--baize)}
.act .ic{width:40px;height:40px;border-radius:var(--r2);display:grid;place-items:center;background:var(--baize2);color:var(--brass2);flex:none}
.act .ic svg{width:22px;height:22px}
.act b{display:block;font-weight:600;font-size:15px}
.act small{color:var(--muted);font-size:13px}
.banner{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:var(--r3);background:linear-gradient(90deg,rgba(201,164,92,.16),rgba(201,164,92,.04));border:1px solid rgba(201,164,92,.35);margin-bottom:22px;animation:rise .4s}
.banner b{font-weight:600}
.banner span{flex:1;color:var(--bone2)}
.mini{position:relative;width:100%;aspect-ratio:1;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.mini i{background:var(--light);background-size:100%;position:relative}
.mini i.d{background-color:var(--dark)}
.mini i.l::before{content:"";position:absolute;inset:0;background:var(--hl)}
.mini i>span{position:absolute;inset:0;background-size:100%;filter:drop-shadow(0 1px 1px rgba(20,14,8,.3))}
.lgame{display:grid;gap:8px;text-decoration:none;color:inherit;cursor:pointer;padding:10px;border-radius:var(--r3);border:1px solid var(--line);background:var(--felt2);transition:border-color .15s,background .15s;text-align:left}
.lgame:hover{border-color:var(--line2);background:var(--baize)}
.lgame .pl{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.lgame .pl b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lgame .pl span{color:var(--muted);font-variant-numeric:tabular-nums}
.lgame .pl em{margin-left:auto;font-style:normal;font-variant-numeric:tabular-nums;color:var(--bone2);font-weight:500}
.livegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .tx{flex:1;min-width:0;line-height:1.3}
.li .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx small{color:var(--muted);font-size:12.5px}
.li .rk{width:26px;color:var(--dim);font-variant-numeric:tabular-nums;font-size:13px;text-align:right;flex:none}
.li .rt{font-weight:600;font-variant-numeric:tabular-nums}
.li.me{background:rgba(201,164,92,.07);border-radius:var(--r2)}
.li.clk{cursor:pointer;border-radius:var(--r2);transition:background .12s}
.li.clk:hover{background:var(--baize)}
.res{width:28px;height:28px;border-radius:var(--r1);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.res.W{background:rgba(128,185,140,.16);color:var(--win)}.res.L{background:rgba(212,122,102,.16);color:var(--loss)}.res.D{background:rgba(163,171,159,.16);color:var(--draw)}
.rcards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rc{padding:14px 16px;border-radius:var(--r3);background:var(--felt2);border:1px solid var(--line);display:grid;gap:2px;text-align:left;transition:border-color .15s}
.rc.on{border-color:var(--brass)}
.rc small{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:7px}
.rc small svg{width:15px;height:15px;color:var(--brass2)}
.rc b{font:500 32px/1.1 var(--serif);font-variant-numeric:lining-nums tabular-nums}
.rc span{font-size:12.5px;color:var(--dim)}
.chart{width:100%;height:200px;display:block}
.chart text{fill:var(--dim);font:500 11px var(--sans)}
.daily{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
.ptabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.ptabs button{padding:7px 13px;border-radius:20px;font-size:13.5px;color:var(--muted);border:1px solid var(--line2)}
.ptabs button.on{background:var(--bone);border-color:var(--bone);color:#18201b;font-weight:500}
.set{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set div{flex:1;min-width:0}
.set b{display:block;font-weight:500;font-size:14.5px}
.set small{color:var(--muted);font-size:13px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.swatches button{display:grid;gap:7px;font-size:13px;color:var(--muted);text-align:left;padding:6px;border-radius:var(--r2);border:1px solid transparent}
.swatches button.on{border-color:var(--brass);color:var(--bone)}
.swatches .sw{aspect-ratio:1;border-radius:4px;overflow:hidden;display:grid;grid-template:1fr 1fr/1fr 1fr}
.swatches .ps{aspect-ratio:1;border-radius:4px;display:grid;place-items:center;background:var(--dark)}
.swatches .ps i{width:80%;height:80%;background-size:100%}
.avpick{display:flex;gap:6px;flex-wrap:wrap}
.avpick button{border-radius:9px;padding:2px;border:2px solid transparent}
.avpick button.on{border-color:var(--brass)}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(8,12,10,.6);display:grid;place-items:center;padding:20px;animation:fade .2s;backdrop-filter:blur(2px)}
.modal{width:min(420px,100%);max-height:calc(100% - 40px);overflow:auto;background:var(--felt2);border:1px solid var(--line2);border-radius:16px;padding:24px;box-shadow:0 40px 90px -30px rgba(0,0,0,.9);animation:mod .32s cubic-bezier(.2,.9,.25,1.05);position:relative}
.modal.wide{width:min(620px,100%)}
@keyframes mod{from{transform:translateY(10px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal h2{font:600 28px/1.1 var(--serif);margin-bottom:6px}
.modal .x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:var(--r2);color:var(--muted);display:grid;place-items:center}
.modal .x:hover{background:var(--baize);color:var(--bone)}
.modal .x svg{width:18px;height:18px}
.form{display:grid;gap:12px;margin-top:16px}
.form label{display:grid;gap:6px;font-size:13.5px;color:var(--muted);font-weight:500}
.err{color:#f1ab9b;font-size:13.5px;min-height:20px}
.result{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,14,12,.5);z-index:40;animation:fade .3s}
.rcard{width:min(330px,88%);background:var(--felt2);border:1px solid var(--line2);border-radius:16px;padding:26px 22px 20px;text-align:center;box-shadow:0 40px 80px -24px rgba(0,0,0,.85);animation:mod .45s cubic-bezier(.2,.9,.25,1.1);position:relative}
.rcard .x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:var(--r2);color:var(--muted);display:grid;place-items:center}
.rcard .x svg{width:17px;height:17px}
.rcard h3{font:500 46px/1 var(--serif);letter-spacing:-.02em;margin:12px 0 6px}
.rcard .why{color:var(--muted);font-size:14px}
.rcard .vs{display:flex;justify-content:center;align-items:center;gap:16px}
.rcard .vs .av{--s:56px}
.rcard .vs .av.win{box-shadow:0 0 0 3px var(--felt2),0 0 0 5px var(--brass)}
.rcard .vs em{font:500 17px var(--serif);font-style:normal;color:var(--muted)}
.rcard .rate{margin:12px 0 18px;font-size:14.5px;color:var(--bone2);font-variant-numeric:tabular-nums}
.rcard .rate b{margin-left:6px}
.rcard .stack{display:grid;gap:8px}
.toasts{position:fixed;right:20px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;background:var(--baize2);border:1px solid var(--line2);padding:11px 15px;border-radius:var(--r2);font-weight:500;font-size:14px;box-shadow:0 14px 34px -10px rgba(0,0,0,.6);animation:tin .3s cubic-bezier(.2,.9,.25,1.1);max-width:360px}
.toast.out{animation:tout .25s forwards}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{transform:translateY(6px);opacity:0}}
.challenge{display:grid;gap:14px;text-align:center;justify-items:center}
.challenge .tt{font:500 34px/1 var(--serif)}
.timer{height:3px;background:var(--baize3);border-radius:2px;overflow:hidden;width:100%}
.timer i{display:block;height:100%;background:var(--brass);animation:drain 60s linear forwards}
@keyframes drain{from{width:100%}to{width:0}}
.search{display:grid;justify-items:center;gap:6px;padding:26px 16px;border-radius:var(--r3);background:var(--baize);text-align:center}
.search b{font:600 21px var(--serif)}
.search small{color:var(--muted)}
.spin{width:40px;height:40px;border-radius:50%;border:2px solid var(--baize3);border-top-color:var(--brass);animation:spin .9s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.code{font:500 44px/1 var(--serif);letter-spacing:.14em;color:var(--brass2)}
.joinrow{display:flex;gap:8px}
#codeIn{text-transform:uppercase;letter-spacing:.14em;font-weight:600}
.skel{background:linear-gradient(90deg,var(--baize) 0,var(--baize2) 50%,var(--baize) 100%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:var(--r2)}
@keyframes sk{to{background-position:-200% 0}}
.enter>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}

@media (max-width:1180px){
  :root{--side:72px}
  .brand b,.nav a span,.me-chip div,.nav a .dot{display:none}
  .brand{justify-content:center;padding-inline:0}
  .nav a{justify-content:center;padding:11px 0}
  .me-chip{justify-content:center}
  .quickgrid{grid-template-columns:repeat(5,1fr)}
}
@media (max-width:1000px){.cols{grid-template-columns:1fr}.rcards{grid-template-columns:repeat(2,1fr)}.acts{grid-template-columns:1fr}}
@media (max-width:900px){
  html,body{overflow-x:hidden}
  body{overflow-y:auto}
  .app{display:block;height:auto;min-height:100%}
  .side{display:none}
  .main{height:auto;overflow:visible;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .page{height:auto;overflow:visible}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(19,26,22,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar a{flex:1;display:grid;justify-items:center;gap:3px;padding:5px 0;color:var(--dim);text-decoration:none;font-size:11px;font-weight:500;position:relative}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a.on{color:var(--bone)}
  .tabbar a.on svg{color:var(--brass2)}
  .tabbar a .dot{position:absolute;top:2px;left:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:var(--brass);font-size:0;padding:0;min-width:0}
  .stage{flex-direction:column;align-items:center;height:auto;padding-block:8px 20px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));gap:14px}
  .panel{width:100%;height:auto;max-width:640px}
  .pbody{overflow:visible}
  .chatlist{max-height:240px}
  .clock{font-size:19px;min-width:96px;padding:6px 11px}
  .wrap{padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .ptitle h1{font-size:34px}
  .quickgrid{grid-template-columns:repeat(3,1fr);gap:8px}
  .qt{min-height:96px;padding:12px}
  .qt b{font-size:30px}
  .toasts{left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));align-items:stretch}
  .bots{grid-template-columns:repeat(4,1fr)}
  .rcards{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:420px){.quickgrid{grid-template-columns:repeat(2,1fr)}.daily{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- 3.0: daily, messages, achievements, trainer ---------- */
.role{display:inline-block;margin-left:10px;font:600 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--brass2);border:1px solid rgba(201,164,92,.45);padding:4px 7px 3px;border-radius:4px;vertical-align:middle}
.role.mod{color:#9cc3a4;border-color:rgba(128,185,140,.45)}
.flag{font-size:.62em;vertical-align:.12em;font-family:system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.bio{margin:0;color:var(--bone);font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.about{display:flex;gap:18px;align-items:flex-start;margin:-8px 0 20px}
.about .tx{flex:1;min-width:0;display:grid;gap:10px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:13px}
.facts span{display:inline-flex;align-items:center;gap:6px}
.facts svg{width:15px;height:15px;color:var(--brass2)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.achv{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:var(--r2);background:var(--felt);border:1px solid var(--line);opacity:.5;filter:saturate(0)}
.achv.on{opacity:1;filter:none;background:linear-gradient(135deg,rgba(201,164,92,.12),rgba(201,164,92,.02));border-color:rgba(201,164,92,.3)}
.achv b{display:block;font-weight:600;font-size:13.5px}
.achv small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.ai{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--baize2);color:var(--brass2);flex:none}
.ai svg{width:18px;height:18px}
.achv.on .ai{background:var(--brass);color:var(--brass-ink)}
.achmini{display:flex;align-items:center;gap:6px;margin-top:14px;flex-wrap:wrap}

var OPEN=[];

function openingOf(sans){var best=null;OPEN.forEach(function(o){if(o.san.length<=sans.length&&(!best||o.san.length>best.san.length)){for(var i=0;i<o.san.length;i++)if(o.san[i]!==sans[i])return;best=o;}});return best;}
function isBook(sans,i){return OPEN.some(function(o){if(o.san.length<=i)return false;for(var k=0;k<=i;k++)if(o.san[k]!==sans[k])return false;return true;});}

function isBoardRoute(){return BOARD_ROUTES[route]||(route==='watch'&&SS.watch&&!SS.watch.left);}

function viewPos(S){if(S.view===S.moves.length)return S.pos;if(!S._vp||S._vpi!==S.view){S._vp=new Pos(S.fens[S.view]);S._vpi=S.view;}return S._vp;}
function sans(S,n){return S.moves.slice(0,n==null?S.moves.length:n).map(function(m){return m.san;});}

function doMove(S,m,dragged,silent){
  var P=S.pos,lg=P.legal(),san=P.san(m,lg),f=m&63,t=(m>>6)&63,fl=m>>15,capSq=(fl&2)?t+(P.turn===0?8:-8):t,cap=(fl&1)?P.b[capSq]:0,color=P.turn,u=P.uci(m);
  P.make(m);
  var e={m:m,uci:u,san:san,color:color,cap:cap,from:f,to:t};
  S.moves.push(e);S.fens.push(P.fen());S.view=S.moves.length;S._vp=null;
  S._anim=dragged?null:{m:m,cap:cap,capSq:capSq};
  if(!silent){if(P.inCheck())sfx('check');else if(fl&4)sfx('castle');else if(cap)sfx('capture');else sfx('move');}
  if(S.startFen===START)S.opening=openingOf(sans(S))||S.opening;
  return e;}
function undoMove(S){if(!S.moves.length)return;S.pos.unmake();S.moves.pop();S.fens.pop();S.view=S.moves.length;S._vp=null;if(S.startFen===START)S.opening=openingOf(sans(S));}
function setView(S,v,anim){if(!S)return;v=Math.max(0,Math.min(S.moves.length,v));if(v===S.view)return;var fwd=v===S.view+1;S.view=v;
  if(fwd&&anim!==false){var e=S.moves[v-1],fl=e.m>>15;S._anim={m:e.m,cap:e.cap,capSq:(fl&2)?e.to+(e.color===0?8:-8):e.to};var P=viewPos(S);if(P.inCheck())sfx('check');else if(e.cap)sfx('capture');else sfx('move');}
  renderBoard();updatePanel();}

/* ---------- online connection ---------- */
function netSend(o){if(NET.ws&&NET.ws.readyState===1){NET.ws.send(JSON.stringify(o));return true;}toast('Not connected to the server. Reconnecting…');return false;}
function netConnect(){if(!ONLINE)return;var ws;
  try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');}catch(e){return;}
  NET.ws=ws;
  ws.onopen=function(){NET.retry=800;ws.send(JSON.stringify({t:'hello',token:store.get('token',null)}));};
  ws.onmessage=function(e){var m;try{m=JSON.parse(e.data);}catch(er){return;}try{netMsg(m);}catch(er){console.error(er);}};
  ws.onclose=function(){if(NET.ws!==ws)return;var was=NET.ok;NET.ok=false;NET.queue=null;NET.room=null;
    setTimeout(netConnect,NET.retry);NET.retry=Math.min(NET.retry*1.7,10000);if(was){renderNav();refreshView();}};}
function refreshView(){if(isBoardRoute()){renderPanel();renderBars();}else renderPage();}
function netMsg(m){var S=SS.play;
  switch(m.t){
    case 'welcome':NET.ok=true;NET.me=m.me;NET.cfg=m.cfg||{};store.set('token',m.token);renderNav();refreshView();
      if(NET.pendingWatch||NET.pendingGame){if(NET.pendingWatch)netSend({t:'watch',gid:NET.pendingWatch});if(NET.pendingGame){NET.wantReview=NET.pendingGame;netSend({t:'game',id:NET.pendingGame});}NET.pendingWatch=NET.pendingGame=null;try{history.replaceState(null,'',location.pathname+location.hash);}catch(e){}}
      if(NET.pendingJoin){var code=NET.pendingJoin;NET.pendingJoin=null;netSend({t:'join',code:code});try{history.replaceState(null,'',location.pathname+location.hash);}catch(e){}}
      if(route==='watch'&&SS.watch&&!SS.watch.left&&SS.watch.gid)netSend({t:'watch',gid:SS.watch.gid});
      if(route==='home'||route==='watch')netSend({t:'live'});
      break;
    case 'auth_ok':store.set('token',m.token);NET.me=m.me;closeModal();toast(m.msg||'Signed in');renderNav();refreshView();break;
    case 'auth_error':var er=$('.modal .err');if(er)er.textContent=m.msg;else toast(m.msg);var bt=$('.modal button[type=submit]');if(bt)bt.disabled=false;break;
    case 'me':NET.me=m.me;if(SS.play.online&&SS.play.players){var mp=SS.play.players[SS.play.userColor];mp.title=m.me.title;mp.name=m.me.name;mp.avatar=m.me.avatar;}renderNav();if(!isBoardRoute())renderPage();else renderBars();break;
    case 'cfg':NET.cfg=m.cfg;if(!isBoardRoute())renderPage();else renderPanel();break;
    case 'admin_msg':sfx('notify');openModal('<h2>Message from Rookery</h2><p class="note" style="font-size:15px;color:var(--bone)">'+esc(m.text)+'</p><div class="form"><button class="btn pri" data-close>OK</button></div>');break;
    case 'banned':NET.ok=false;NET.ws=null;openModal('<h2>Disconnected</h2><p class="note">'+esc(m.msg||'This account is suspended.')+'</p>',{noclose:true});break;
    case 'stats':NET.stats=m;var el=$('#netstats');if(el)el.textContent=statsText();break;
    case 'announce':NET.announce=m.text?m:null;if(m.text&&!isBoardRoute())renderPage();if(m.text)toast(m.text,6000);break;
    case 'friends':NET.friends=m;renderNav();if(route==='community'||route==='home')renderPage();break;
    case 'friend_request':sfx('notify');toast(m.from.name+' sent you a friend request');break;
    case 'leaderboard':NET.lb[m.cat]=m.rows;if(route==='community')renderPage();break;
    case 'search':NET.search=m.rows;if(route==='community')renderSearch();break;
    case 'live':NET.live=m.games;if(route==='home'||(route==='watch'&&!isBoardRoute()))renderPage();break;
    case 'player':showPlayer(m.player);break;
    case 'history':if(m.id===(NET.me&&NET.me.id)){NET.history=m.games;if(route==='profile')renderPage();}break;
    case 'game':if(NET.wantReview===m.game.id){NET.wantReview=null;reviewRecord(m.game);}break;
    case 'queued':NET.queue=m.tc;NET.room=null;refreshView();break;
    case 'room':NET.room=m.code;NET.roomTc=m.tc;NET.queue=null;if(route!=='play')go('play');else refreshView();break;
    case 'idle':NET.queue=null;NET.room=null;refreshView();break;
    case 'challenge_in':NET.chIn[m.cid]=m;sfx('notify');showChallenge(m);renderNav();break;
    case 'challenge_out':NET.chOut[m.cid]=m;toast('Challenge sent to '+m.to.name);break;
    case 'challenge_gone':delete NET.chIn[m.cid];var o=NET.chOut[m.cid];delete NET.chOut[m.cid];var cm=$('.scrim [data-cid="'+m.cid+'"]');if(cm)closeModal(cm.closest('.scrim'));
      if(o&&m.reason==='declined')toast(o.to.name+' declined your challenge');else if(o&&m.reason==='expired')toast('Your challenge to '+o.to.name+' expired');renderNav();break;
    case 'start':onlineStart(m);break;
    case 'watch':watchStart(m);break;
    case 'move':if(S.online&&S.gid===m.gid)onlineMove(S,m);else if(SS.watch&&SS.watch.gid===m.gid)onlineMove(SS.watch,m);break;
    case 'end':if(S.online&&S.gid===m.gid)onlineEnd(S,m);else if(SS.watch&&SS.watch.gid===m.gid)watchEnd(SS.watch,m);break;
    case 'draw_offer':if(S.online&&S.active){S.drawIn=true;sfx('notify');toast(S.opp.name+' offers a draw');updatePanel();}break;
    case 'rematch_offer':if(S.online&&S.gid===m.gid){S.rematchIn=true;sfx('notify');toast(S.opp.name+' wants a rematch');updatePanel();renderOverlay();}break;
    case 'presence':var T=(S.online&&S.gid===m.gid)?S:(SS.watch&&SS.watch.gid===m.gid?SS.watch:null);if(T){var prev=T.presence;T.presence=m.online;
      if(T===S&&T.active&&prev){var oc=S.userColor^1;if(prev[oc]&&!m.online[oc])toast(S.opp.name+' disconnected. They have 60 seconds to return.',4000);else if(!prev[oc]&&m.online[oc])toast(S.opp.name+' is back');}
      if(cur()===T)renderBars();}break;
    case 'spect':if(S.online&&S.gid===m.gid){S.spect=m.n;var sc=$('#spectN');if(sc)sc.textContent=spectText(m.n);}break;
    case 'chat':{var C=(S.online&&S.gid===m.gid)?S:null;if(!C)break;(C.chat=C.chat||[]).push(m);if(m.from!==C.userColor){if(settings.sound)tone(988,.07,'sine',.05);if(C.tab!=='chat'){C.unread=(C.unread||0)+1;updateTabs();}}updateChat(C);}break;
    case 'puzzle_rating':var PZ=SS.puzzles;if(PZ&&PZ.pending){PZ.pending=false;PZ.delta=m.d;PZ.ratingAfter=m.r;updatePanel();}break;
    case 'info':toast(m.msg);break;
    case 'error':toast(m.msg);var b2=$('.modal button[type=submit]');if(b2)b2.disabled=false;break;
  }}
function statsText(){var s=NET.stats;return s.online+' online, '+s.playing+' game'+(s.playing===1?'':'s')+' in progress';}
function spectText(n){return n?n+' watching':'';}
function netName(p){return p?p.name:'?';}

function onlineStart(m){
  var old=SS.play,same=old.online&&old.gid===m.gid;
  var S=session('play');S.setup=false;S.online=true;S.gid=m.gid;S.userColor=m.color;S.orient=same?old.orient:m.color;S.presence=m.online;S.spect=m.spect;
  S.players=[m.white,m.black];S.opp=m.color?m.white:m.black;S.chat=m.chat||[];S.tab=same?old.tab:'moves';S.unread=0;S.rated=m.rated;S.cat=m.cat;
  var tc=tcParse(m.tc);S.tc=tc;S.times=m.times||[];
  m.moves.forEach(function(u){var mv=S.pos.parseUci(u);if(mv)doMove(S,mv,true,true);});S._anim=null;
  S.clock=tc.base?{t:m.clock.slice(),inc:tc.inc,last:now()}:null;
  S.active=!m.over;if(m.over){S.over=m.over;}
  if(m.drawFrom===(m.color^1))S.drawIn=true;
  NET.queue=null;NET.room=null;SS.play=S;eng.play.cancel();
  if(!same){sfx('start');if(!m.moves.length)toast('Game on. You play '+(m.color?'Black':'White'));}
  if(route!=='play')go('play');else renderAll();
  tryPremove(S);}
function onlineMove(S,m){
  if(S.moves.length>=m.n){if(S.moves[m.n-1].uci!==m.uci)return resync(S);}
  else if(S.moves.length===m.n-1){var mv=S.pos.parseUci(m.uci);if(!mv)return resync(S);var atEnd=S.view===S.moves.length;doMove(S,mv,false,!atEnd&&cur()===S);if(!atEnd){S.view=S.moves.length-1;}}
  else return resync(S);
  (S.times=S.times||[])[m.n-1]=m.clock[(m.n-1)%2===0?0:1];
  if(S.clock){S.clock.t=m.clock.slice();S.clock.last=now();}
  S.drawIn=false;S.armDraw=false;S.lowWarned=false;
  if(cur()===S){renderBoard();updatePanel();}
  if(S.kind==='play')tryPremove(S);}
function resync(S){if(S.kind==='watch')netSend({t:'watch',gid:S.gid});else netSend({t:'sync'});}
function onlineEnd(S,m){
  S.active=false;S.armDraw=S.armResign=false;S.drawIn=false;S.premove=null;board.premove=null;
  if(m.result==='aborted'){S.over={result:'*',reason:'aborted'};S.aborted=true;toast('Game aborted. Ratings are unchanged.');renderAll();return;}
  S.over={result:m.result,reason:m.reason};S.showResult=true;
  var r=m.ratings[S.userColor];S.rBefore=r[0];S.rAfter=r[1];S.delta=r[1]-r[0];
  var score=m.result==='1/2-1/2'?.5:(((m.result==='1-0')===(S.userColor===0))?1:0);S.score=score;
  S.rec={id:S.gid,online:true,startFen:S.startFen,moves:S.moves.map(function(x){return x.uci;}),result:m.result,reason:m.reason,userColor:S.userColor,tc:S.tc.key,
    players:[{name:S.players[0].name,avatar:S.players[0].avatar,rating:S.players[0].rating},{name:S.players[1].name,avatar:S.players[1].avatar,rating:S.players[1].rating}],date:Date.now()};
  sfx(score===1?'win':'end');renderAll();}
function watchStart(m){
  if(SS.watch&&SS.watch.gid!==m.gid&&!SS.watch.left)netSend({t:'unwatch'});
  var S=session('watch');S.gid=m.gid;S.players=[m.white,m.black];S.userColor=-1;S.orient=0;S.presence=m.online;S.spect=m.spect;S.rated=m.rated;
  var tc=tcParse(m.tc);S.tc=tc;S.times=m.times||[];
  m.moves.forEach(function(u){var mv=S.pos.parseUci(u);if(mv)doMove(S,mv,true,true);});S._anim=null;
  S.clock=tc.base?{t:m.clock.slice(),inc:tc.inc,last:now()}:null;S.active=!m.over;if(m.over)S.over=m.over;
  SS.watch=S;if(route!=='watch')go('watch');else renderAll();}
function watchEnd(S,m){S.active=false;S.over={result:m.result,reason:m.reason};S.endRatings=m.ratings;sfx('end');if(cur()===S)renderAll();}

var board,stageEl,pageEl,panel,evalbar;

  var mob=innerWidth<=900,S=cur(),ev=showEval(S),bs,main=$('#main');
  evalbar.hidden=!ev;
  if(mob){var vw=Math.min(innerWidth,document.documentElement.clientWidth||9999,(screen&&screen.width)||9999);bs=Math.min(vw-24-(ev?28:0),640);}

/* ---------- navigation ---------- */
function badgeCount(){return Object.keys(NET.chIn).length+(NET.friends.incoming||[]).length;}
function renderNav(){
  var items=[['home','Home',I.home],['play','Play',I.play],['puzzles','Puzzles',I.puzzle],['analysis','Analysis',I.analysis],['watch','Watch',I.watch],['community','Community',I.community],['profile','Profile',I.profile],['prefs','Settings',I.prefs]];
  var bc=badgeCount();
  function on(k){return route===k||(route==='review'&&k==='play');}
  $('#nav').innerHTML=items.map(function(x){return '<a href="#'+x[0]+'" class="'+(on(x[0])?'on':'')+'"'+(on(x[0])?' aria-current="page"':'')+' title="'+x[1]+'">'+x[2]+'<span>'+x[1]+'</span>'+(x[0]==='community'&&bc?'<i class="dot">'+bc+'</i>':'')+'</a>';}).join('');
  var tb=[['home','Home',I.home],['play','Play',I.play],['puzzles','Puzzles',I.puzzle],['community','Social',I.community],['profile','Profile',I.profile]];
  $('#tabbar').innerHTML=tb.map(function(x){return '<a href="#'+x[0]+'" class="'+(on(x[0])||(x[0]==='profile'&&route==='prefs')||(x[0]==='home'&&route==='watch')||(x[0]==='play'&&route==='analysis')?'on':'')+'">'+x[2]+'<span>'+x[1]+'</span>'+(x[0]==='community'&&bc?'<i class="dot"></i>':'')+'</a>';}).join('');
  var r=NET.me?NET.me.ratings.blitz.r:profile.rating;

function go(r,opt){
  if(ROUTES.indexOf(r)<0)r='home';
  if(r==='review'&&!SS.review)r='play';
  if(r==='puzzles'&&!SS.puzzles)nextPuzzle(true);
  var prev=route;route=r;navSeq++;
  if(location.hash!=='#'+r){try{history.replaceState(null,'',location.pathname+location.search+'#'+r);}catch(e){location.hash=r;}}
  if(prev==='analysis'&&r!=='analysis')eng.ana.cancel();
  if(prev==='watch'&&r!=='watch'&&SS.watch&&!SS.watch.left){netSend({t:'unwatch'});SS.watch.left=true;}
  if(r==='watch'&&SS.watch&&SS.watch.left)SS.watch=null;
  board.sArrows=[];board.badge=null;board.sel=-1;board.hintSq=-1;
  if(ONLINE&&NET.ok){if(r==='home'||r==='watch')netSend({t:'live'});if(r==='community'){netSend({t:'leaderboard',cat:NET.lbCat||'blitz'});netSend({t:'friends'});}if(r==='profile'&&NET.me)netSend({t:'history'});}
  renderAll();
  if(!isBoardRoute())pageEl.scrollTop=0;
  if(innerWidth<=900){window.scrollTo(0,0);requestAnimationFrame(function(){window.scrollTo(0,0);});}}
addEventListener('hashchange',function(){var h=location.hash.slice(1);if(h&&h!==route)go(h);});
function renderAll(){applyTheme();renderNav();
  var b=isBoardRoute();stageEl.hidden=!b;pageEl.hidden=b;
  if(b){layout();renderPanel();renderBoard();}else renderPage();}

/* ---------- board rendering ---------- */
function showEval(S){if(!S)return false;if(route==='analysis')return !!S.engineOn;if(route==='review')return !!(S.done);if(S.kind==='play')return settings.evalInGame&&(!!S.over||(!!S.local&&!S.setup));return false;}
function isInteractive(S){var P=viewPos(S);
  if(S.kind==='play'){if(S.setup||!S.active||S.over||S.thinking)return false;if(S.view!==S.moves.length)return false;if(S.online&&!NET.ok)return false;return S.local||P.turn===S.userColor;}
  if(S.kind==='analysis')return true;
  if(S.kind==='puzzles')return S.state==='play'&&!S.busy&&S.view===S.moves.length&&P.turn===S.userColor;
  return false;}
function premoveColor(S){if(!settings.premove||S.kind!=='play'||S.local||S.setup||!S.active||S.over||S.view!==S.moves.length)return null;return S.pos.turn!==S.userColor?S.userColor:null;}
function renderBoard(){
  var S=cur();if(!S)return;var P=viewPos(S),lm=S.view>0?S.moves[S.view-1]:null;
  board.setOrient(S.orient);
  board.pickColor=(S.kind==='play'&&!S.local)?S.userColor:(S.kind==='puzzles'?S.userColor:null);
  board.sArrows=[];board.badge=null;board.hintSq=-1;
  board.premove=(S.kind==='play'&&S.premove&&S.view===S.moves.length)?S.premove:null;
  if((S.kind==='play'||S.kind==='learn')&&S.hint&&S.view===S.moves.length)board.sArrows.push([S.hint[0],S.hint[1],'#6fae5a']);
  if(S.kind==='puzzles'&&S.view===S.moves.length){if(S.hintSq!=null)board.hintSq=S.hintSq;if(S.hintArrow)board.sArrows.push([S.hintArrow[0],S.hintArrow[1],'#6fae5a']);}
  if(S.kind==='review'&&S.done&&S.view>0){var i=S.view-1,k=S.cls[i],meta=CLS[k];board.badge={sq:S.moves[i].to,g:meta.g,c:meta.c};
    if(['best','brilliant','great','book'].indexOf(k)<0&&S.bests[i]){var bp=new Pos(S.fens[i]),bm=bp.parseUci(S.bests[i]);if(bm)board.sArrows.push([bm&63,(bm>>6)&63,'#6fae5a',.8]);}}
  if(route==='analysis')anaArrows(S);
  board.set(P,{last:lm?[lm.from,lm.to]:null,check:P.inCheck()?P.k[P.turn]:-1,interactive:isInteractive(S),anim:S._anim,premove:premoveColor(S)});

function ratingChart(hist,cat){var pts=(hist||[]).filter(function(h){return h[1]===cat;});
  if(pts.length){var base={bullet:1200,blitz:1200,rapid:1200,puzzle:1500,bots:800}[cat];pts.unshift([pts[0][0]-60000,cat,base]);}
  if(pts.length<2)return '<p class="note" style="padding:30px 0;text-align:center">Play a few '+(cat==='bots'?'computer':cat)+' games to see your rating over time.</p>';
  var W=720,H=200,pad=34,vals=pts.map(function(p){return p[2];}),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  var lo=Math.floor((mn-20)/50)*50,hi=Math.ceil((mx+20)/50)*50;if(hi-lo<100)hi=lo+100;
  var x=function(i){return pad+i/(pts.length-1)*(W-pad-8);},y=function(v){return 10+(1-(v-lo)/(hi-lo))*(H-34);};
  var line=pts.map(function(p,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(p[2]).toFixed(1);}).join(' ');
  var area=line+' L'+x(pts.length-1).toFixed(1)+' '+(H-24)+' L'+x(0)+' '+(H-24)+' Z';
  var ticks='',step=(hi-lo)>400?200:(hi-lo)>200?100:50;for(var v=lo;v<=hi;v+=step)ticks+='<line x1="'+pad+'" x2="'+W+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#2c3831" stroke-width="1"/><text x="0" y="'+(y(v)+4)+'">'+v+'</text>';
  var d0=new Date(pts[0][0]),d1=new Date(pts[pts.length-1][0]),f=function(d){return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});};
  var lp=pts[pts.length-1];
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Rating history"><defs><linearGradient id="rg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c9a45c" stop-opacity=".28"/><stop offset="1" stop-color="#c9a45c" stop-opacity="0"/></linearGradient></defs>'+ticks+
    '<path d="'+area+'" fill="url(#rg)"/><path d="'+line+'" fill="none" stroke="#e0c389" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+x(pts.length-1)+'" cy="'+y(lp[2])+'" r="4.5" fill="#e0c389" stroke="#18211c" stroke-width="2"/>'+
    '<text x="'+pad+'" y="'+(H-6)+'">'+f(d0)+'</text><text x="'+W+'" y="'+(H-6)+'" text-anchor="end">'+f(d1)+'</text></svg>';}

  LEARN_OPEN.forEach(function(o){if(q&&(o.name+' '+o.eco+' '+o.san.join(' ')).toLowerCase().indexOf(q)<0)return;var f=o.name.split(':')[0];if(!fam[f]){fam[f]=[];order.push(f);}fam[f].push(o);});
  if(!order.length)return '<p class="note">No opening matches “'+esc(S.q)+'”.</p>';
  return order.map(function(f){return '<div class="opfam"><div class="h">'+esc(f)+'</div><div class="list">'+fam[f].map(function(o){var i=OPEN.indexOf(o),st=opStars(o,side);

function learnPanel(S){
  if(S.pick){var mastered=LEARN_OPEN.filter(function(o){return opStars(o,S.side)>=3;}).length;
    return '<div class="ph"><h2>Opening trainer</h2><span class="meta">'+mastered+' of '+LEARN_OPEN.length+' mastered</span></div><div class="pbody">'+
      '<p class="note">Pick a line and play your side from memory. The book answers for the other side.</p><div class="seg">'+[[0,'Train as White',PIMG[6]],[1,'Train as Black',PIMG[14]]].map(function(x){return '<button class="'+(S.side===x[0]?'on':'')+'" data-act="opside" data-k="'+x[0]+'"><i style="background-image:'+x[2]+'"></i>'+x[1]+'</button>';}).join('')+'</div>'+
      '<input id="opSearch" placeholder="Search openings, ECO codes or moves" autocomplete="off" spellcheck="false" aria-label="Search openings">'+
      '<div id="opList">'+learnList(S)+'</div></div><div class="pfoot"><button class="btn pri lg block" data-act="oprandom">'+I.bolt+'Random line</button></div>';}
  return '<div class="ph"><h2>'+esc(S.op.name)+'</h2><span class="meta">'+S.op.eco+', as '+(S.side?'Black':'White')+'</span></div><div class="pbody"><div id="lstatus"></div><div class="mvl" id="mvlist"></div>'+
    (S.done?'':'<div class="row" style="margin-top:auto"><button class="btn ghost sm" data-act="ophint">'+I.hint+'Hint</button><button class="btn ghost sm" data-act="opagain">Restart</button><button class="btn ghost sm" data-act="oplist">All openings</button></div>')+'</div><div class="ctrl" id="ctrl"></div>';}
document.addEventListener('input',function(e){if(e.target.id==='opSearch'&&SS.learn){SS.learn.q=e.target.value;var l=$('#opList');if(l)l.innerHTML=learnList(SS.learn);}});
function pickRandomLine(side){var pool=LEARN_OPEN.filter(function(o){return opStars(o,side)<3;});if(!pool.length)pool=LEARN_OPEN;var q=SS.learn&&SS.learn.q?SS.learn.q.toLowerCase():'';
  if(q){var f=pool.filter(function(o){return (o.name+' '+o.eco).toLowerCase().indexOf(q)>=0;});if(f.length)pool=f;}
  return pool[Math.floor(Math.random()*pool.length)];}

var _onAct=onAct;onAct=function(e){
  var a=e.target.closest('[data-act]');if(!a){_onAct(e);return;}var act=a.dataset.act,S=cur(),k=a.dataset.k;
  switch(act){
    case 'stab':if(k==='daily'&&isAccount())netSend({t:'daily_list'});break;
    /* daily */
    case 'dopen':netSend({t:'daily_open',gid:a.dataset.gid});return;
    case 'dlist':setup.tab='daily';SS.play.setup=SS.play.setup||!(SS.play.active&&!SS.play.over);if(SS.play.setup){go('play');netSend({t:'daily_list'});}else go('play');return;
    case 'ddays':dailySet.days=+k;store.set('dailyset',dailySet);renderPanel();return;
    case 'dcolor':dailySet.color=k;store.set('dailyset',dailySet);renderPanel();return;
    case 'dseek':ac();netSend({t:'daily_seek',days:dailySet.days,color:dailySet.color});toast('Open game posted. You will be notified when someone joins.');return;
    case 'dseekno':netSend({t:'daily_seek_cancel',id:a.dataset.id});return;
    case 'dseekyes':ac();netSend({t:'daily_seek_accept',id:a.dataset.id});return;
    case 'dinvyes':ac();netSend({t:'daily_invite_reply',id:a.dataset.id,accept:true});return;
    case 'dinvno':netSend({t:'daily_invite_reply',id:a.dataset.id,accept:false});return;
    case 'dinvite':{var sel=$('#dfriend');if(sel&&sel.value)netSend({t:'daily_invite',to:sel.value,days:dailySet.days,color:dailySet.color});}return;
    case 'dinvto':if(modalStack.length)closeModal();dailyInviteModal(a.dataset.id,a.dataset.name);return;
    case 'dimpick':{var box=a.parentNode;$$('button',box).forEach(function(b){b.classList.toggle('on',b===a);});if(box.id==='dimDays')dailySet.days=+k;else dailySet.color=k;store.set('dailyset',dailySet);}return;
    case 'dimsend':netSend({t:'daily_invite',to:a.dataset.id,days:dailySet.days,color:dailySet.color});closeModal();return;
    case 'ddraw':if(!S||S.kind!=='daily')return;if(S.drawFrom===(S.userColor^1)){netSend({t:'daily_draw',gid:S.gid});return;}
      if(settings.confirm&&!S.armDraw){S.armDraw=true;S.armResign=false;updatePanel();setTimeout(function(){if(S.armDraw){S.armDraw=false;if(cur()===S)updatePanel();}},3000);return;}
      S.armDraw=false;netSend({t:'daily_draw',gid:S.gid});toast('Draw offered');updatePanel();return;
    case 'ddrawyes':netSend({t:'daily_draw',gid:S.gid});return;
    case 'ddrawno':netSend({t:'daily_draw_decline',gid:S.gid});S.drawFrom=-1;updatePanel();return;
    case 'dresign':if(!S||S.kind!=='daily')return;if(settings.confirm&&!S.armResign){S.armResign=true;S.armDraw=false;updatePanel();setTimeout(function(){if(S.armResign){S.armResign=false;if(cur()===S)updatePanel();}},3000);return;}
      S.armResign=false;netSend({t:'daily_resign',gid:S.gid});return;
    case 'dreview':if(S&&S.kind==='daily'){startReview({id:S.gid,online:true,startFen:START,moves:S.moves.map(function(m){return m.uci;}),result:S.over.result,reason:S.over.reason,userColor:S.userColor,tc:'none',date:S.over.ts||Date.now(),
        players:S.players.map(function(p){return {name:p.name,avatar:p.avatar,rating:p.rating};})});}return;
    /* messages */
    case 'dmto':if(modalStack.length)closeModal();NET.dm.openId=a.dataset.id;NET.dm.thread=null;if(route==='inbox'){renderInbox();netSend({t:'dm_open',id:a.dataset.id});}else go('inbox');return;
    case 'dmopen':NET.dm.openId=a.dataset.id;if(!NET.dm.thread||NET.dm.thread.id!==a.dataset.id)NET.dm.thread=null;renderInbox();netSend({t:'dm_open',id:a.dataset.id});return;
    case 'dmback':NET.dm.openId=null;NET.dm.thread=null;renderInbox();netSend({t:'dm_list'});return;
    case 'dmsend':dmSend();return;
    /* profile */
    case 'editprof':editProfileModal();return;
    /* share */
    case 'share5':if(S&&S.rec)shareModal(S);return;
    case 'gif5':if(S&&S.rec){shareModal(S);var g=$('[data-act=makegif]');if(g)g.click();}return;
    case 'sharegame':{var P=SS.play,rec=(S&&S.kind==='daily')?{online:true,id:a.dataset.id,result:S.over&&S.over.result}:(P.rec||{online:true,id:a.dataset.id});var T=S&&S.rec?S:{rec:rec,fens:S.fens,moves:S.moves,orient:S.orient,over:S.over,kind:S.kind,players:S.players,userColor:S.userColor,pos:S.pos,setup:false,online:true,opp:S.opp,local:S.local,bot:S.bot};if(!T.rec)T.rec=rec;shareModal(T);}return;
    case 'sharecopy':copyText($('#shareIn').value,'Link');return;
    case 'sharenative':try{navigator.share({title:'Chess game on Rookery',url:$('#shareIn').value}).catch(function(){});}catch(er){}return;
    case 'makegif':{var GS=shareModal.S,box=$('#gifBox');if(!GS||!box)return;box.innerHTML='<div class="prog"><i id="gifProg" style="width:0"></i></div><p class="fine">Rendering '+GS.fens.length+' frames…</p>';
      makeGif(GS,function(blob){var url=URL.createObjectURL(blob),bx=$('#gifBox');if(!bx)return;bx.innerHTML='<img class="gifprev" src="'+url+'" alt="Animated replay of the game"><div class="row"><a class="btn pri" href="'+url+'" download="rookery-game.gif">Download GIF</a><span class="fine" style="align-self:center">'+(blob.size/1024/1024).toFixed(1)+' MB</span></div>';},
        function(p){var pr=$('#gifProg');if(pr)pr.style.width=(p*100).toFixed(0)+'%';});}return;
    /* trainer */
    case 'opside':S.side=+k;S.orient=S.side;store.set('opside',S.side);renderPanel();renderBoard();return;
    case 'opstart':{var o=OPEN[+a.dataset.i];if(o)startLine(o,SS.learn?SS.learn.side:0);}return;
    case 'oprandom':{var sd=SS.learn?SS.learn.side:0;startLine(pickRandomLine(sd),sd);}return;
    case 'opagain':if(S&&S.op)startLine(S.op,S.side);return;
    case 'oplist':{var L=learnSession();L.side=S.side;L.orient=S.side;L.q=S.q||'';SS.learn=L;renderAll();}return;
    case 'ophint':if(S&&S.op&&!S.done&&S.pos.turn===S.side){var wm=S.pos.parseUci(S.op.uci[S.ply]);if(wm){S.hint=[wm&63,(wm>>6)&63];S.miss++;S.note={ok:false,t:'Hint shown. This run counts as a mistake.'};renderBoard();updatePanel();}}return;
  }
  _onAct(e);};

  if(!ONLINE)return '<p>The contact form works on the Rookery server.</p>';
  return (e?'<p>Email: <a href="mailto:'+esc(e)+'">'+esc(e)+'</a>. Or use the form below.</p>':'<p>Send a message to the people who run Rookery. Add an email address if you want a reply.</p>')+
   '<form class="form" data-form="contact6" id="contactForm"><label>Topic<select id="ctKind"><option value="question">A question or idea</option><option value="report">A problem or a player</option><option value="privacy">My data or privacy</option><option value="copyright">Copyright or license notice</option><option value="other">Something else</option></select></label>'+
   '<label>Your email (optional)<input id="ctEmail" type="email" maxlength="120" autocomplete="email" placeholder="Only needed if you want a reply"></label>'+
   '<label>Message<textarea id="ctText" maxlength="3000" rows="6" required placeholder="How can we help?"></textarea></label><div class="err" role="alert"></div><button class="btn pri lg" type="submit">Send message</button></form>'+
   '<h2>Copyright and license notices</h2><p>If you believe something on Rookery uses your work without permission, pick “Copyright or license notice” and include: what the work is, where it appears on Rookery, how we can reach you, and a statement that you own the rights or act for the owner. We review every notice and remove material that should not be here.</p>';}

/* ---------- signup consent and first-visit notice ---------- */
var _authModal=authModal;authModal=function(mode){_authModal(mode);if(mode!=='signup')return;var f=$('.modal form[data-form=signup] .err');if(!f)return;
  f.insertAdjacentHTML('beforebegin','<label class="agree"><input type="checkbox" id="authAgree" required><span>I am at least 13 years old and I agree to the <a href="#terms" data-close>Terms of Service</a>, the <a href="#privacy" data-close>Privacy Policy</a> and the <a href="#rules" data-close>Community Rules</a>.</span></label>');};
function legalNotice(){if(!ONLINE)return;var v=NET.cfg&&NET.cfg.terms||'1';if(store.get('legalok','')===v||$('#legalbar'))return;
  var d=document.createElement('div');d.id='legalbar';d.className='legalbar';d.innerHTML='<span>By using Rookery you agree to the <a href="#terms">Terms</a> and the <a href="#privacy">Privacy Policy</a>. We store your settings in this browser and use no tracking cookies.</span><button class="btn sm pri" data-act="legalok">OK</button>';document.body.appendChild(d);}

/* ---------- settings: privacy and account ---------- */
var _prefsPage=prefsPage;prefsPage=function(){var h=_prefsPage();if(!ONLINE||!NET.me)return h;var me=NET.me,bl=me.blocked||[];
  var sec='<section class="blk"><h2>Privacy and account</h2><div class="card" style="display:grid;gap:14px">'+
    (me.guest?'<p class="note">You are playing as a guest. Guest data is removed after a period without visits.</p>':
    '<div class="set" style="padding:0;border:0"><div><b>Download my data</b><small>Your account, games, daily games and private messages as a file</small></div><button class="btn" data-act="exportme">'+I.download+'Download</button></div>'+
    '<div><b style="font-weight:600">Blocked players</b>'+(bl.length?'<div class="list" style="margin-top:6px">'+bl.map(function(b){return '<div class="li"><span class="tx"><b>'+esc(b.name)+'</b></span><button class="btn sm" data-act="unblock6" data-id="'+b.id+'">Unblock</button></div>';}).join('')+'</div>':'<p class="fine" style="margin-top:4px">Nobody. Block players from their profile.</p>')+'</div>'+
    '<div class="set" style="padding:0;border:0"><div><b>Delete my account</b><small>Removes your account, ratings, messages and daily games for good</small></div><button class="btn bad" data-act="deleteme">'+I.trash+'Delete</button></div>')+
    '<p class="fine"><a href="#privacy">Privacy Policy</a> · <a href="#terms">Terms</a> · <a href="#rules">Community rules</a> · <a href="#contact">Contact</a></p></div></section>';
  var mk='<section class="blk"><h2>About Rookery</h2>';return h.indexOf(mk)>=0?h.replace(mk,sec+mk):h+sec;};
function deleteModal(){openModal('<h2>Delete your account</h2><p class="note">This removes your account, ratings, achievements, private messages and daily games right away. Running daily games are lost. Finished games stay in the history as “Deleted player”. This cannot be undone.</p><form class="form" data-form="delete6"><label>Type your password to confirm<input id="delPw" type="password" autocomplete="current-password" required></label><div class="err" role="alert"></div><button class="btn bad lg" type="submit">Delete my account for good</button></form>');}
function downloadJSON(obj,name){try{var b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},3000);}catch(e){toast('Download failed');}}

/* ---------- player card: block and report ---------- */
var _showPlayer6=showPlayer;showPlayer=function(p){_showPlayer6(p);var me=NET.me;if(!me||me.id===p.id)return;
  var m=modalStack[modalStack.length-1],md=m&&m.querySelector('.modal');if(!md)return;var row=md.querySelector('.row');if(!row)return;
  var isB=(me.blocked||[]).some(function(b){return b.id===p.id;});
  row.insertAdjacentHTML('afterend','<div class="row safety"><button class="btn ghost sm" data-act="'+(isB?'unblock6':'block6')+'" data-id="'+p.id+'" data-name="'+esc(p.name)+'">'+I.ban+(isB?'Unblock':'Block')+'</button><button class="btn ghost sm" data-act="report6" data-id="'+p.id+'" data-name="'+esc(p.name)+'" data-where="profile">'+I.report+'Report</button></div>');};
var _dmThreadHTML=dmThreadHTML;dmThreadHTML=function(){var h=_dmThreadHTML(),T=NET.dm.thread;if(!T||T.id!==NET.dm.openId)return h;
  return h.replace('<button class="btn ghost sm" data-act="player"','<button class="btn ghost sm" data-act="report6" data-id="'+T.id+'" data-name="'+esc(T.who.name)+'" data-where="dm" title="Report">'+I.report+'</button><button class="btn ghost sm" data-act="player"');};
function reportModal(id,name,where){openModal('<h2>Report '+esc(name)+'</h2><p class="note">'+(where==='dm'?'Your recent messages with them are attached so a moderator can see what happened.':'A moderator will look at their account.')+'</p><form class="form" data-form="report6" data-id="'+id+'" data-where="'+where+'"><label>Reason<select id="rpWhy"><option>Harassment or insults</option><option>Cheating</option><option>Hate or threats</option><option>Inappropriate name or bio</option><option>Spam</option><option>Underage user</option><option>Other</option></select></label><label>Details (optional)<textarea id="rpNote" maxlength="300" rows="3"></textarea></label><label class="agree"><input type="checkbox" id="rpBlock" checked><span>Also block '+esc(name)+'</span></label><button class="btn pri lg" type="submit">Send report</button></form>');}

/* ---------- actions, forms, messages ---------- */
var _onAct6=onAct;onAct=function(e){var a=e.target.closest('[data-act]');if(!a){_onAct6(e);return;}var act=a.dataset.act;
  switch(act){
    case 'legalok':store.set('legalok',NET.cfg&&NET.cfg.terms||'1');var lb=$('#legalbar');if(lb)lb.remove();return;
    case 'exportme':if(netSend({t:'export_data'}))toast('Preparing your data');return;
    case 'deleteme':deleteModal();return;
    case 'block6':netSend({t:'block',id:a.dataset.id});if(modalStack.length)closeModal();return;
    case 'unblock6':netSend({t:'unblock',id:a.dataset.id});if(modalStack.length)closeModal();return;
    case 'report6':if(modalStack.length)closeModal();reportModal(a.dataset.id,a.dataset.name,a.dataset.where||'profile');return;
  }
  _onAct6(e);};
var _onSubmit6=onSubmit;onSubmit=function(form){var f=form.dataset.form;
  if(f==='contact6'){var t=$('#ctText').value.trim();if(t.length<10){form.querySelector('.err').textContent='Please write a little more so we can help.';return;}
    form.querySelector('button[type=submit]').disabled=true;if(!netSend({t:'contact',kind:$('#ctKind').value,email:$('#ctEmail').value.trim(),text:t}))form.querySelector('button[type=submit]').disabled=false;return;}
  if(f==='delete6'){var b=form.querySelector('button[type=submit]');b.disabled=true;NET.deleting=true;if(!netSend({t:'delete_account',password:$('#delPw').value}))b.disabled=false;return;}
  if(f==='report6'){var id=form.dataset.id;netSend({t:'report_player',id:id,where:form.dataset.where,reason:$('#rpWhy').value,note:$('#rpNote').value});if($('#rpBlock').checked)netSend({t:'block',id:id});closeModal();return;}
  _onSubmit6(form);};
var _netMsg6=netMsg;netMsg=function(m){
  switch(m.t){
    case 'contact_ok':{var fm=$('#contactForm');if(fm)fm.outerHTML='<div class="msg ok">Thank you. Your message has been sent'+($('#ctEmail')&&$('#ctEmail').value?' and we will reply by email':'')+'.</div>';else toast('Message sent');}return;
    case 'export':downloadJSON(m.data,'rookery-my-data-'+new Date().toISOString().slice(0,10)+'.json');toast('Your data was downloaded');return;
    case 'banned':if(NET.wasDeleted)return;break;
    case 'deleted':NET.deleting=false;NET.wasDeleted=true;store.set('token',null);try{localStorage.removeItem('rookery:profile');}catch(e){}NET.ok=false;var w=NET.ws;NET.ws=null;try{w&&w.close();}catch(e){}
      while(modalStack.length)closeModal();openModal('<h2>Your account was deleted</h2><p class="note">Everything connected to it has been removed. Thank you for playing on Rookery.</p><div class="form"><button class="btn pri" data-act="reloadsite">OK</button></div>',{noclose:true});return;
    case 'error':if(NET.deleting){NET.deleting=false;var er=$('.modal form[data-form=delete6] .err');if(er){er.textContent=m.msg;var bt=$('.modal form[data-form=delete6] button[type=submit]');if(bt)bt.disabled=false;return;}}
      {var cf=$('#contactForm');if(cf){var b2=cf.querySelector('button[type=submit]');if(b2&&b2.disabled){b2.disabled=false;cf.querySelector('.err').textContent=m.msg;return;}}}break;
  }
  _netMsg6(m);
  if(m.t==='welcome'||m.t==='cfg'){applyCommercial();applyTheme();legalNotice();if(LEGAL_ROUTES.indexOf(route)>=0||route==='prefs')renderPage();}
  if(m.t==='me'&&route==='prefs')renderPage();};
document.addEventListener('click',function(e){var a=e.target.closest('[data-act=reloadsite]');if(a)location.href=location.pathname;});

/* ---------- start ---------- */
boot();

})();
</script>

</body></html>
